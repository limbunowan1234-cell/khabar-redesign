name = "khabar-worker"
main = "src/index.ts"
compatibility_date = "2024-09-23"

# Explicit -- attaching the api.khabardarjeeling.in custom domain
# (below) silently disabled this Worker's own khabar-worker.<account>
# .workers.dev route on deploy. That route is still hardcoded as
# WORKER_URL across ~15 files (articles, likes, bookmarks, Bhasa
# Diwas, contest, follows, photography, admin analytics -- everything
# except auth), so losing it broke most of the site's dynamic
# features. Keep both routes alive until those call sites are moved
# to the custom domain.
workers_dev = true

# Filled in after running `npm run db:create` — it prints a database_id,
# paste it below. Nothing here works until that's real.
[[d1_databases]]
binding = "DB"
database_name = "khabar-d1"
database_id = "991e6a3d-1aca-4c2a-bbdf-5b8d374d45b8"

[[r2_buckets]]
binding = "IMAGES"
bucket_name = "khabar-article-images"

# Three schedules, all handled by scheduled() in src/index.ts (branches on
# event.cron), no HTTP auth needed for any of them:
#   "0 1 * * *"  -- daily, 30-day analytics_events retention (Week 32).
#   "0 0 * * SUN"  -- weekly (Sunday 00:00 UTC), publishes pending weekly
#                   picks (Week 35). Replaces two Vercel-cron routes that
#                   were both independently doing this same write against
#                   Appwrite on the same schedule -- app/api/publish-weekly
#                   and a Sunday-only branch inside
#                   app/api/revalidate-sitemaps -- neither of which could
#                   keep writing to Appwrite once articles froze there
#                   in Week 34.
#   "0 */3 * * *"  -- every 3 hours: [weather-alerts feature] pushes a
#                   notification to users in a hill town whose forecast
#                   just crossed into RED/ORANGE alert territory. Same
#                   "no Vercel cron slot" reasoning as the other two --
#                   Vercel Hobby caps at 2, this Worker isn't capped the
#                   same way.
[triggers]
crons = ["0 1 * * *", "0 0 * * SUN", "0 */3 * * *"]

# api.khabardarjeeling.in used to be Appwrite's own custom domain (a CNAME
# to nyc.cloud.appwrite.io) -- the one thing lib/appwrite.ts's `endpoint`
# constant pointed at. Repointed here at this Worker instead, now that
# auth (the only thing that domain was ever used for) lives here. Wrangler
# manages the DNS record + SSL cert for this automatically on deploy.
[[routes]]
pattern = "api.khabardarjeeling.in"
custom_domain = true

# APK downloads are staying on Appwrite permanently (explicit decision —
# not a deferral). Only 2 files, no bandwidth pressure, not worth the
# extra bucket/route/script surface.

# Secrets (set via `wrangler secret put NAME`, never committed here):
#   AUTH_JWT_SECRET — signs/verifies the short-lived access JWTs issued by
#     POST /auth/token (see src/routes/auth.ts, src/lib/jwt.ts). Also held
#     as a Vercel env var of the same name for the ~9 Next.js admin API
#     routes that verify these tokens locally without a round-trip through
#     this Worker (see lib/serverAuth.ts on the Next.js side). Auth was
#     migrated off Appwrite entirely after Appwrite Cloud's Storage quota
#     was exceeded and put the whole project (including auth) behind a
#     billing_limit_exceeded 402 — see the migration plan.
#   RESEND_API_KEY — sends password-reset emails via Resend's HTTP API
#     (see src/lib/email.ts). Optional: POST /auth/request-password-reset
#     no-ops the send (but still returns 200) if this isn't set.
#   SERVICE_SECRET — shared with Vercel's WORKER_SERVICE_SECRET env var.
#     Lets app/api/send-notification/route.ts create notifications and read
#     push subscriptions for arbitrary recipients (not its own JWT identity)
#     without opening that up to the public — see verifyService() in
#     src/lib/auth.ts.
